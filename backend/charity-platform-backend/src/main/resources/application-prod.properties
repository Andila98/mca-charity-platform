# ===== PRODUCTION OVERRIDES =====
# This file is active when SPRING_PROFILES_ACTIVE=prod

# ===== LOGGING =====
logging.level.root=WARN
logging.level.com.charity=INFO
logging.level.org.springframework.security=WARN

# ===== JPA =====
# validate: Hibernate only checks the schema — Liquibase owns all changes in production.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ===== LIQUIBASE =====
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# ===== ERROR HANDLING =====
# Never expose stack traces or internal messages to clients
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ===== SWAGGER =====
# Disabled in production
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ===== CORS =====
# Must be set via environment variable in production
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ===== COOKIES =====
# Refresh token cookie requires HTTPS in production
cookie.secure=true
