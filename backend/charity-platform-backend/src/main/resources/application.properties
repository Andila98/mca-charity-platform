# ===== APPLICATION CONFIGURATION =====
spring.application.name=charity-platform-backend
spring.main.allow-bean-definition-overriding=true

# ===== SERVER CONFIGURATION =====
server.port=8080

# ===== DATABASE CONFIGURATION =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/charity_platform?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
# XAMPP defaults: root / empty password. Override via DB_USERNAME / DB_PASSWORD env vars in production.
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ===== JPA/HIBERNATE CONFIGURATION =====
# update: Hibernate creates/alters tables automatically — safe for local dev with XAMPP.
# Production overrides this to "validate" and uses Liquibase instead (see application-prod.properties).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===== LIQUIBASE CONFIGURATION =====
# Disabled locally — Hibernate ddl-auto=update handles the schema.
# Production re-enables Liquibase and switches to ddl-auto=validate.
spring.liquibase.enabled=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# ===== LOGGING CONFIGURATION =====
logging.level.root=INFO
logging.level.com.charity=INFO
logging.level.org.springframework.security=WARN

# ===== JWT CONFIGURATION =====
# In production, set JWT_SECRET as an environment variable (must be a 256-bit base64 string).
# The fallback below is for LOCAL DEVELOPMENT ONLY — never use it in production.
jwt.secret=${JWT_SECRET:dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLW9ubHktbm90LWZvci1wcm9kdWN0aW9u}
# Access token: 15 minutes (900,000 ms)
jwt.access-token-expiration=900000
# Refresh token: 7 days
jwt.refresh-token-expiration-days=7

# ===== CORS CONFIGURATION =====
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5500,http://127.0.0.1:5500,http://127.0.0.1:5173,http://localhost:8081

# ===== COOKIE CONFIGURATION =====
# Set to true in production (HTTPS only)
cookie.secure=false

# ===== SWAGGER/OPENAPI CONFIGURATION =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ===== FILE UPLOAD CONFIGURATION =====
upload.dir=${UPLOAD_DIR:uploads/images}
upload.url-base=${UPLOAD_URL_BASE:http://localhost:8080/uploads/images}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ===== SECURITY CONFIGURATION =====
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ===== PERFORMANCE TUNING =====
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.connection-timeout=20000

# ===== ERROR HANDLING =====
server.error.include-stacktrace=on_param
server.error.include-message=always
server.error.include-binding-errors=always

# ===== ENCODING =====
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===== TIMEZONE =====
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===== VALIDATION =====
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
