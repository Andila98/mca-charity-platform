# ===== TEST PROFILE =====
# Active when @ActiveProfiles("test") or SPRING_PROFILES_ACTIVE=test

# ===== IN-MEMORY DATABASE =====
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# ===== LIQUIBASE (disabled in tests - H2 uses ddl-auto=create-drop) =====
spring.liquibase.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# ===== JWT (test-only secret — never use in production) =====
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLW9ubHktbm90LWZvci1wcm9kdWN0aW9u

# ===== SUPPRESS UNNECESSARY LOGS IN TESTS =====
logging.level.root=WARN
logging.level.com.charity=INFO
logging.level.org.springframework.security=WARN
